<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon source. The mark is the exact `#i-logo` path from index.html and the
  exact mint gradient stops the topbar brand uses, so the launcher icon and the
  in-app brand are the same artwork rather than two drawings that drift apart.

  The mark is drawn at ~48% of the canvas width. That is deliberate: Android's
  adaptive-icon mask keeps only the centre 66% circle, and at this size the
  mark's diagonal (~664px) still clears that 676px circle, so no corner of the
  glyph is ever shaved off by a round or squircle mask.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="iconMarkGrad" gradientUnits="userSpaceOnUse" x1="8" y1="1.5" x2="24" y2="30.5">
      <stop offset="0" stop-color="#b7ffe6" />
      <stop offset=".18" stop-color="#4dffae" />
      <stop offset=".52" stop-color="#00ff86" />
      <stop offset="1" stop-color="#07b06d" />
    </linearGradient>
    <radialGradient id="iconGlow" gradientUnits="userSpaceOnUse" cx="512" cy="470" r="430">
      <stop offset="0" stop-color="#00ff86" stop-opacity=".20" />
      <stop offset=".55" stop-color="#00ff86" stop-opacity=".06" />
      <stop offset="1" stop-color="#00ff86" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Brand base, matching T.PALETTE's darkest stage colour. -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="#070b12" />
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#iconGlow)" />

  <!-- translate/scale/translate centres the glyph's own 32-unit bbox centre (16,16). -->
  <g transform="translate(512 512) scale(16) translate(-16 -16)">
    <path fill="url(#iconMarkGrad)" fill-rule="evenodd" d="M9.2 1.9H22.8Q26.6 1.9 27.27 5.7L31.14 27.5Q31.6 30.1 29 30.1H3Q.4 30.1 .86 27.5L4.73 5.7Q5.4 1.9 9.2 1.9ZM6.04 25.6L7.1 7H12.1L20.49 17.4 19.9 7H24.9L25.96 25.6H20.96L11.69 14.13 11.04 25.6Z" />
  </g>
</svg>
