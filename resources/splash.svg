<?xml version="1.0" encoding="UTF-8"?>
<!--
  Splash source. 2732x2732 square because the launch image is centre-cropped to
  every possible device aspect ratio (`androidScaleType: CENTER_CROP`); a square
  canvas with the mark dead centre is the only shape that survives both a tall
  phone and a landscape tablet without shifting the glyph off centre.

  The mark sits at ~20% of the canvas width, so after the worst-case crop it
  still reads as a logo rather than filling the screen. Background is the same
  #070b12 as the WebView and the status bar, which is what makes the handoff
  from splash to first paint invisible.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <defs>
    <linearGradient id="splashMarkGrad" gradientUnits="userSpaceOnUse" x1="8" y1="1.5" x2="24" y2="30.5">
      <stop offset="0" stop-color="#b7ffe6" />
      <stop offset=".18" stop-color="#4dffae" />
      <stop offset=".52" stop-color="#00ff86" />
      <stop offset="1" stop-color="#07b06d" />
    </linearGradient>
    <radialGradient id="splashGlow" gradientUnits="userSpaceOnUse" cx="1366" cy="1366" r="1100">
      <stop offset="0" stop-color="#00ff86" stop-opacity=".14" />
      <stop offset=".45" stop-color="#00ff86" stop-opacity=".04" />
      <stop offset="1" stop-color="#00ff86" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="2732" height="2732" fill="#070b12" />
  <rect width="2732" height="2732" fill="url(#splashGlow)" />

  <g transform="translate(1366 1366) scale(18) translate(-16 -16)">
    <path fill="url(#splashMarkGrad)" fill-rule="evenodd" d="M9.2 1.9H22.8Q26.6 1.9 27.27 5.7L31.14 27.5Q31.6 30.1 29 30.1H3Q.4 30.1 .86 27.5L4.73 5.7Q5.4 1.9 9.2 1.9ZM6.04 25.6L7.1 7H12.1L20.49 17.4 19.9 7H24.9L25.96 25.6H20.96L11.69 14.13 11.04 25.6Z" />
  </g>
</svg>
